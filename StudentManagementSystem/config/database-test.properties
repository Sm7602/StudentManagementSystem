# =============================================================================
# Configuration used ONLY by the automated tests (run-tests.sh / run-tests.bat
# pass -Ddb.config=config/database-test.properties).
#
# The tests create, empty and refill tables, so they run against a separate
# database. The test helper refuses to run unless the name ends with "_test".
# Credentials can be supplied with DB_USERNAME / DB_PASSWORD as for the app.
# =============================================================================

db.url=jdbc:mysql://localhost:3306/student_management_test?rewriteBatchedStatements=true
db.username=root
db.password=

pool.initialSize=5
pool.minIdle=5
pool.maxIdle=10
pool.maxTotal=20
pool.maxWaitMillis=10000
pool.maxOpenPreparedStatements=100
pool.timeBetweenEvictionRunsMillis=30000

app.sqlScriptsDir=database
backup.directory=out/test-backups
backup.mysqldumpPath=mysqldump
backup.mysqlPath=mysql
