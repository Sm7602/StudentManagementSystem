# =============================================================================
# Student Management System - database configuration
#
# Credentials: prefer the environment variables DB_USERNAME and DB_PASSWORD.
# When set, they override db.username / db.password below, so no password has
# to be stored in this file.
# =============================================================================

# JDBC URL - the database name in the URL is the database the application uses.
# rewriteBatchedStatements=true lets MySQL Connector/J send a JDBC batch of
# INSERTs as multi-row INSERT statements (fewer round trips).
db.url=jdbc:mysql://localhost:3306/student_management?rewriteBatchedStatements=true
db.username=root
db.password=

# -----------------------------------------------------------------------------
# Connection pool (Apache Commons DBCP2)
# -----------------------------------------------------------------------------
# Connections opened when the pool starts
pool.initialSize=5
# Minimum idle connections kept ready (maintained by the evictor thread)
pool.minIdle=5
# Maximum idle connections kept in the pool
pool.maxIdle=10
# Maximum connections open at the same time (active + idle)
pool.maxTotal=20
# How long getConnection() waits for a free connection before failing
pool.maxWaitMillis=10000
# PreparedStatement caching: maximum statements cached across the pool
pool.maxOpenPreparedStatements=100
# Interval of the evictor thread that removes stale connections and refills minIdle
pool.timeBetweenEvictionRunsMillis=30000

# -----------------------------------------------------------------------------
# Paths (relative to the project root, i.e. the directory you run from)
# -----------------------------------------------------------------------------
# SQL scripts executed by menu option 1 (Initialize Database)
app.sqlScriptsDir=database
# Where --backup writes its .sql files
backup.directory=backups
# MySQL client tools used for backup / restore. Use the full path if they are not
# on the PATH, e.g. C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe
backup.mysqldumpPath=mysqldump
backup.mysqlPath=mysql
